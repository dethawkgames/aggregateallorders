name: Close cycle (after you submit supplier orders)

on:
  workflow_dispatch:
    inputs:
      last_order:
        description: 'Number of the LAST order you submitted to suppliers (e.g. 5990)'
        required: true
        type: string
      run_now:
        description: 'Immediately pick up everything placed since (recommended)'
        type: boolean
        default: true

concurrency:
  group: order-aggregation
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Close cycle
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_EMAIL: ${{ secrets.GOOGLE_SA_EMAIL }}
          GOOGLE_SA_PRIVATE_KEY: ${{ secrets.GOOGLE_SA_PRIVATE_KEY }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node src/cli.js close-cycle "${{ inputs.last_order }}" ${{ inputs.run_now && '--run-now' || '' }}
